name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet
      - name: Build APK
        run: |
          flet build apk mobile \
            --project "Arithmetic Super App" \
            --org "com.nothacker" \
            --product "arithmetic-super-app"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: arithmetic-super-app-apk
          path: build/apk/*.apk
          if-no-files-found: error
