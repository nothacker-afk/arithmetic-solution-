name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: |
          python --version
          pip --version

      - name: Install package + all test deps
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[dev,web]"

      - name: Show installed packages
        run: |
          pip list | grep -iE "(flask|pytest|strawberry|jwt|socketio|sqlalchemy|alembic|redis|pywebpush|webauthn|cryptography|openai|yaml|httpx)" || true

      - name: Run tests (serial, verbose on first failure)
        run: pytest -v --tb=short
        env:
          PYTHONUNBUFFERED: "1"
          FAST_HASH: "1"
          RETENTION_ENABLED: "0"
          BACKGROUND_INTERVAL_SECONDS: "9999"
          SCHEDULER_INTERVAL_SECONDS: "9999"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache-py${{ matrix.python-version }}
          path: .pytest_cache/
          if-no-files-found: ignore
