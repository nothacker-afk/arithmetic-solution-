[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmetic-super-app"
version = "0.4.0"
description = "Modular arithmetic engine with CLI, web, AI, and full-stack auth + history."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "nothacker-afk"}]
keywords = ["arithmetic", "math", "calculator", "matrix", "scientific",
            "cli", "web", "ai", "nlp", "jwt", "fullstack"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "PyJWT>=2.8",
]
ai = ["openai>=1.0"]
mobile = ["flet>=0.24"]

[project.scripts]
arithmetic-cli = "cli.main:main"
arithmetic-ai  = "ai_engine.cli:main"

[project.urls]
Homepage = "https://github.com/nothacker-afk/arithmetic-solution-"

[tool.setuptools.packages.find]
where = ["."]
include = ["arithmetic*", "cli*", "web*", "ai_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["arithmetic", "cli", "web", "ai_engine"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
