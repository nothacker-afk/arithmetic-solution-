[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmetic-super-app"
version = "0.3.1"
description = "A modular arithmetic engine with CLI, web, and AI-powered natural language interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "nothacker-afk"}]
keywords = ["arithmetic", "math", "calculator", "matrix", "scientific", "cli", "web", "ai", "nlp"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
web = [
    "flask>=3.0",
    "flask-cors>=4.0",
]
ai = ["openai>=1.0"]

[project.scripts]
arithmetic-cli = "cli.main:main"
arithmetic-ai  = "ai_engine.cli:main"

[project.urls]
Homepage = "https://github.com/nothacker-afk/arithmetic-solution-"

[tool.setuptools.packages.find]
where = ["."]
include = ["arithmetic*", "cli*", "web*", "ai_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
