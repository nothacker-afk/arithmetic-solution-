replicaCount: 1

image:
  repository: arithmetic-super-app
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "RELEASE-NAME-arithmetic"
  hosts:
    - host: arithmetic.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  accessMode: ReadWriteOnce

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  DB_BACKEND: sqlite
  JWT_EXPIRY_HOURS: "24"

secrets:
  # Auto-generated if left empty; override in production
  secretKey: ""
  jwtSecret: ""

nodeSelector: {}
tolerations: []
affinity: {}
