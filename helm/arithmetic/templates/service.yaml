apiVersion: v1
kind: Service
metadata:
  name: {{ include "arithmetic.fullname" . }}
  labels:
    {{- include "arithmetic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "arithmetic.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
