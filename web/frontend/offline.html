<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Offline — Arithmetic Super App</title>
<style>
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a; color: #e2e8f0; min-height: 100vh;
        display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .box { text-align: center; max-width: 340px; }
    h1 { font-size: 1.4rem; background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 12px; }
    p { color: #94a3b8; margin-bottom: 20px; font-size: .9rem; }
    button { background: linear-gradient(90deg, #38bdf8, #818cf8); color: #0f172a;
        border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600;
        cursor: pointer; font-size: 1rem; }
    button:hover { opacity: .9; }
</style>
</head>
<body>
<div class="box">
    <h1>You're offline</h1>
    <p>The Arithmetic Super App needs a network connection for
       calculations, but the shell is cached and will load as soon as
       you're back online.</p>
    <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
