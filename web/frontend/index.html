<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Arithmetic Super App</title>
<meta name="theme-color" content="#38bdf8" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/static/icon-192.svg" />
<link rel="stylesheet" href="/static/css/design.css" />
<link rel="stylesheet" href="/static/css/components.css" />
<link rel="stylesheet" href="/static/css/chat-addons.css" />
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/crypto.js"></script>
<script src="/static/i18n.js"></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
    <header class="app-header">
        <h1 class="app-title">Arithmetic Super App</h1>
        <div class="header-actions">
            <span id="user-label" class="muted">Guest</span>
            <button id="passkey-btn" class="btn btn-icon hidden" title="Sign in with passkey">🔑</button>
            <button id="install-btn" class="btn btn-icon hidden" title="Install app">⤓</button>
            <button id="theme-btn" class="btn btn-icon" title="Toggle theme">🌓</button>
            <button id="lang-btn" class="btn btn-icon" title="Cycle language">EN</button>
            <button id="auth-btn" class="btn">Login</button>
        </div>
    </header>
    <nav class="tabs" role="tablist">
        <div class="tab active" data-tab="basic" role="tab">Basic</div>
        <div class="tab" data-tab="scientific" role="tab">Scientific</div>
        <div class="tab" data-tab="matrix" role="tab">Matrix</div>
        <div class="tab" data-tab="ai" role="tab">AI</div>
        <div class="tab" data-tab="realtime" role="tab">Live</div>
        <div class="tab" data-tab="history" role="tab">History</div>
        <div class="tab" data-tab="search" role="tab">Search</div>
        <div class="tab" data-tab="dms" role="tab">DMs</div>
    </nav>
    <main id="main" class="card">
        <section class="tab-panel active" id="panel-basic" role="tabpanel">
            <div class="field"><label for="basic-op">Operation</label>
                <select id="basic-op" class="select">
                    <option value="add">Add (+)</option>
                    <option value="subtract">Subtract (−)</option>
                    <option value="multiply">Multiply (×)</option>
                    <option value="divide">Divide (÷)</option>
                    <option value="power">Power (^)</option>
                    <option value="modulo">Modulo (%)</option>
                    <option value="floor_divide">Floor Divide (//)</option>
                </select></div>
            <div class="field-row">
                <div class="field"><label for="basic-a">a</label><input id="basic-a" class="input" type="number" step="any" value="10" /></div>
                <div class="field"><label for="basic-b">b</label><input id="basic-b" class="input" type="number" step="any" value="5" /></div>
            </div>
            <button id="basic-calc" class="btn btn-primary">Calculate</button>
        </section>
        <section class="tab-panel" id="panel-scientific" role="tabpanel">
            <div class="field"><label for="sci-op">Operation</label>
                <select id="sci-op" class="select">
                    <option value="sqrt">Square Root</option>
                    <option value="cbrt">Cube Root</option>
                    <option value="log10">Log base 10</option>
                    <option value="sin">Sine</option>
                    <option value="cos">Cosine</option>
                    <option value="tan">Tangent</option>
                    <option value="factorial">Factorial</option>
                    <option value="absolute">Absolute Value</option>
                </select></div>
            <div class="field"><label for="sci-x">x</label><input id="sci-x" class="input" type="number" step="any" value="16" /></div>
            <button id="sci-calc" class="btn btn-primary">Calculate</button>
        </section>
        <section class="tab-panel" id="panel-matrix" role="tabpanel">
            <div class="field"><label for="matrix-op">Operation</label>
                <select id="matrix-op" class="select">
                    <option value="matrix_add">Add</option>
                    <option value="matrix_subtract">Subtract</option>
                    <option value="matrix_multiply">Multiply</option>
                    <option value="matrix_transpose">Transpose (A only)</option>
                </select></div>
            <div class="field"><label for="matrix-a">Matrix A (e.g. 1,2;3,4)</label><input id="matrix-a" class="input" value="1,2;3,4" /></div>
            <div class="field"><label for="matrix-b">Matrix B</label><input id="matrix-b" class="input" value="5,6;7,8" /></div>
            <button id="matrix-calc" class="btn btn-primary">Calculate</button>
        </section>
        <section class="tab-panel" id="panel-ai" role="tabpanel">
            <div class="field"><label for="ai-input">Ask in plain English</label>
                <input id="ai-input" class="input" placeholder="e.g. what is 15% of 240" /></div>
            <button id="ai-solve" class="btn btn-primary">Solve</button>
        </section>
        <section class="tab-panel" id="panel-realtime" role="tabpanel">
            <div class="field-row">
                <div class="field"><label for="rt-room">Room</label><input id="rt-room" class="input" value="demo-room" /></div>
                <div class="field"><label for="rt-user">Display name</label><input id="rt-user" class="input" value="guest" /></div>
            </div>
            <div class="field-row">
                <button id="rt-join" class="btn btn-primary">Join</button>
                <button id="rt-leave" class="btn">Leave</button>
            </div>
            <p id="rt-status" class="muted">Not connected.</p>
            <div id="rt-avatars"></div>
            <hr style="border:none;border-top:1px solid var(--border);margin:var(--sp-4) 0;" />
            <div class="export-bar">
                <button id="rt-export-md" class="btn">⬇ Markdown</button>
                <button id="rt-export-html" class="btn">⬇ HTML / PDF</button>
            </div>
            <h3>Chat</h3>
            <div class="field">
                <label for="rt-e2e"><input id="rt-e2e" type="checkbox" style="width:auto;margin-right:6px;" /> E2E encrypt</label>
                <input id="rt-passphrase" class="input hidden" type="password" placeholder="Room passphrase" />
            </div>
            <div id="rt-chat-log" class="chat-log"></div>
            <p id="rt-typing" class="muted" style="height:1.2em;"></p>
            <div class="field-row">
                <input id="rt-chat-input" class="input" placeholder="Type a message…" />
                <button id="rt-mic" class="btn" style="flex:0 0 auto;" title="Record voice">🎤 Voice</button>
                <button id="rt-send" class="btn btn-primary" style="flex:0 0 auto;">Send</button>
            </div>
            <h3 class="mt-4">Files</h3>
            <div id="rt-file-list"></div>
            <h3 class="mt-4">Live feed</h3>
            <div id="rt-feed"></div>
        </section>

        <section class="tab-panel" id="panel-search" role="tabpanel">
            <div class="field">
                <label for="search-input">Search</label>
                <input id="search-input" class="input" placeholder="Type to search calculations and chat…" />
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="search-scope">Scope</label>
                    <select id="search-scope" class="select">
                        <option value="all">Everything</option>
                        <option value="calculations">Calculations only</option>
                        <option value="chat">Chat only</option>
                    </select>
                </div>
            </div>
            <button id="search-go" class="btn btn-primary">Search</button>
            <p id="search-engine" class="muted mt-4" style="font-size:var(--fs-sm);"></p>
            <div id="search-results" class="mt-4"></div>
        </section>

        <section class="tab-panel" id="panel-dms" role="tabpanel">
            <div class="field-row">
                <div class="field"><label for="dm-new-user">Start conversation with</label>
                    <input id="dm-new-user" class="input" placeholder="username" /></div>
                <button id="dm-start" class="btn btn-primary" style="align-self:flex-end;margin-bottom:var(--sp-3);">Start</button>
            </div>
            <div class="field">
                <label for="dm-passphrase">Shared passphrase (E2E)</label>
                <input id="dm-passphrase" class="input" type="password" placeholder="Agree on this out-of-band" />
            </div>
            <h3>Conversations</h3>
            <button id="dm-refresh" class="btn btn-ghost" style="margin-bottom:var(--sp-2);">Refresh</button>
            <div id="dm-threads"></div>
            <div id="dm-conversation" class="hidden mt-4">
                <h3>Chat with <span id="dm-conversation-title"></span></h3>
                <div class="export-bar">
                    <button id="dm-export-md" class="btn">⬇ Markdown</button>
                    <button id="dm-export-html" class="btn">⬇ HTML / PDF</button>
                </div>
                <div id="dm-typing"></div>
                <div id="dm-messages" class="chat-log" style="max-height:300px;"></div>
                <div class="field-row mt-2">
                    <input id="dm-input" class="input" placeholder="Type a message…" />
                    <button id="dm-mic" class="btn" style="flex:0 0 auto;" title="Voice message">🎤</button>
                    <button id="dm-send" class="btn btn-primary" style="flex:0 0 auto;">Send</button>
                </div>
            </div>
        </section>
        <section class="tab-panel" id="panel-history" role="tabpanel">
            <div id="history-list"></div>
            <button id="history-refresh" class="btn mt-4">Refresh</button>
        </section>
        <div id="result" class="result-panel mt-4">Ready.</div>
    </main>
    <footer class="muted text-center mt-4" style="font-size:var(--fs-xs);">
        Press <span class="cmdk-kbd">Ctrl</span>+<span class="cmdk-kbd">K</span> ·
        <a href="/admin">Admin</a>
    </footer>
</div>
<script src="/static/js/api.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/i18n_client.js"></script>
<script src="/static/js/commands.js"></script>
<script src="/static/js/tabs/basic.js"></script>
<script src="/static/js/tabs/scientific.js"></script>
<script src="/static/js/tabs/matrix.js"></script>
<script src="/static/js/tabs/ai.js"></script>
<script src="/static/js/tabs/history.js"></script>
<script src="/static/js/tabs/live.js"></script>
<script src="/static/js/tabs/search.js"></script>
<script src="/static/js/tabs/dms.js"></script>
<script src="/static/js/presence.js"></script>
<script src="/static/js/offline.js"></script>
<script src="/static/js/pwa.js"></script>
<script src="/static/js/passkey.js"></script>
<script src="/static/js/voice_recorder.js"></script>
<script src="/static/js/reactions.js"></script>
<script src="/static/js/threads.js"></script>
<script src="/static/js/export_ui.js"></script>
<script src="/static/js/emoji_autocomplete.js"></script>
<script src="/static/js/message_actions.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
