<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arithmetic Super App</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }
    .container {
        background: #1e293b;
        border-radius: 16px;
        padding: 32px;
        max-width: 520px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 {
        font-size: 1.5rem;
        margin-bottom: 8px;
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    p.subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }
    label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    input, select, button {
        font-family: inherit;
        font-size: 1rem;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #0f172a;
        color: #e2e8f0;
        width: 100%;
        margin-bottom: 12px;
    }
    input:focus, select:focus { outline: 2px solid #38bdf8; border-color: transparent; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button {
        background: linear-gradient(90deg, #38bdf8, #818cf8);
        color: #0f172a;
        font-weight: 600;
        cursor: pointer;
        border: none;
        transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    .result {
        margin-top: 16px;
        padding: 16px;
        background: #0f172a;
        border-radius: 8px;
        font-family: "Courier New", monospace;
        font-size: 1.1rem;
        min-height: 44px;
        border-left: 3px solid #38bdf8;
        word-break: break-all;
    }
    .error { border-left-color: #ef4444; color: #fca5a5; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab {
        flex: 1;
        padding: 8px;
        text-align: center;
        border-radius: 8px;
        background: #0f172a;
        cursor: pointer;
        font-size: 0.85rem;
        transition: background 0.2s;
        user-select: none;
    }
    .tab.active { background: #38bdf8; color: #0f172a; font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
</style>
</head>
<body>
<div class="container">
    <h1>Arithmetic Super App</h1>
    <p class="subtitle">Level 3 — Web Interface</p>

    <div class="tabs">
        <div class="tab active" data-tab="basic">Basic</div>
        <div class="tab" data-tab="scientific">Scientific</div>
        <div class="tab" data-tab="matrix">Matrix</div>
        <div class="tab" data-tab="ai">AI</div>
    </div>

    <!-- Basic -->
    <div class="tab-panel active" id="panel-basic">
        <label>Operation</label>
        <select id="basic-op">
            <option value="add">Add (+)</option>
            <option value="subtract">Subtract (−)</option>
            <option value="multiply">Multiply (×)</option>
            <option value="divide">Divide (÷)</option>
            <option value="power">Power (^)</option>
            <option value="modulo">Modulo (%)</option>
            <option value="floor_divide">Floor Divide (//)</option>
        </select>
        <div class="row">
            <div><label>a</label><input type="number" id="basic-a" value="10" step="any" /></div>
            <div><label>b</label><input type="number" id="basic-b" value="5" step="any" /></div>
        </div>
        <button onclick="runBasic()">Calculate</button>
    </div>

    <!-- Scientific -->
    <div class="tab-panel" id="panel-scientific">
        <label>Operation</label>
        <select id="sci-op">
            <option value="sqrt">Square Root</option>
            <option value="cbrt">Cube Root</option>
            <option value="log10">Log base 10</option>
            <option value="sin">Sine</option>
            <option value="cos">Cosine</option>
            <option value="tan">Tangent</option>
            <option value="factorial">Factorial</option>
            <option value="absolute">Absolute Value</option>
        </select>
        <label>x</label>
        <input type="number" id="sci-x" value="16" step="any" />
        <button onclick="runSci()">Calculate</button>
    </div>

    <!-- Matrix -->
    <div class="tab-panel" id="panel-matrix">
        <label>Operation</label>
        <select id="matrix-op">
            <option value="matrix_add">Add</option>
            <option value="matrix_subtract">Subtract</option>
            <option value="matrix_multiply">Multiply</option>
            <option value="matrix_transpose">Transpose (A only)</option>
        </select>
        <label>Matrix A (e.g. 1,2;3,4)</label>
        <input type="text" id="matrix-a" value="1,2;3,4" />
        <label>Matrix B (e.g. 5,6;7,8)</label>
        <input type="text" id="matrix-b" value="5,6;7,8" />
        <button onclick="runMatrix()">Calculate</button>
    </div>


    <!-- AI -->
    <div class="tab-panel" id="panel-ai">
        <label>Ask in plain English</label>
        <input type="text" id="ai-input" placeholder="e.g. what is 15% of 240" />
        <div class="row">
            <div>
                <label style="margin-top:8px;">
                    <input type="checkbox" id="ai-use-llm" style="width:auto; margin-right:6px;" />
                    Use LLM (requires API key)
                </label>
            </div>
        </div>
        <button onclick="runAI()">Solve</button>
        <p class="subtitle" id="ai-examples" style="margin-top:12px;">
            Try: <code>add 5 and 3</code> · <code>square root of 81</code> ·
            <code>factorial of 6</code> · <code>10 divided by 4</code>
        </p>
    </div>

    <div class="result" id="result">Ready.</div>
</div>

<script>
const API = window.location.origin.startsWith("http")
    ? window.location.origin
    : "http://localhost:8000";

document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        tab.classList.add("active");
        document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
    });
});

function parseMatrix(str) {
    return str.split(";").map(row => row.split(",").map(Number));
}

function showResult(text, isError = false) {
    const el = document.getElementById("result");
    el.textContent = text;
    el.classList.toggle("error", isError);
}

async function post(path, body) {
    const res = await fetch(API + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Request failed");
    return data;
}

async function runBasic() {
    try {
        const data = await post("/api/basic", {
            operation: document.getElementById("basic-op").value,
            a: parseFloat(document.getElementById("basic-a").value),
            b: parseFloat(document.getElementById("basic-b").value),
        });
        showResult(`${data.expression} = ${data.result}`);
    } catch (e) { showResult("Error: " + e.message, true); }
}

async function runSci() {
    try {
        const data = await post("/api/scientific", {
            operation: document.getElementById("sci-op").value,
            x: parseFloat(document.getElementById("sci-x").value),
        });
        showResult(`${data.expression} = ${data.result}`);
    } catch (e) { showResult("Error: " + e.message, true); }
}

async function runMatrix() {
    try {
        const op = document.getElementById("matrix-op").value;
        const a = parseMatrix(document.getElementById("matrix-a").value);
        const body = { operation: op, a };
        if (op !== "matrix_transpose") {
            body.b = parseMatrix(document.getElementById("matrix-b").value);
        }
        const data = await post("/api/matrix", body);
        showResult(`${data.expression} = ${JSON.stringify(data.result)}`);
    } catch (e) { showResult("Error: " + e.message, true); }
}

async function runAI() {
    const text = document.getElementById("ai-input").value.trim();
    if (!text) { showResult("Please type a math question.", true); return; }
    try {
        const useLlm = document.getElementById("ai-use-llm").checked;
        const data = await post("/api/ai", { text, use_llm: useLlm });
        showResult(`${data.expression} = ${data.result}`);
    } catch (e) { showResult("Error: " + e.message, true); }
}
</script>
</body>
</html>
