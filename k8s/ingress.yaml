apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: arithmetic-api
  namespace: arithmetic
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "arithmetic-api"
spec:
  ingressClassName: nginx
  rules:
    - host: arithmetic.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: arithmetic-api
                port:
                  number: 80
